/*
 * Updated build.gradle for Online Auction System
 */

plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    // Them plugin JavaFX
id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Thu vien Gson de xu ly JSON khi giao tiep qua Socket/REST API sau nay
    implementation 'com.google.code.gson:gson:2.10.1'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

/* Temporarily disabled JavaFX until full setup
javafx {
    version = "21"
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}*/


application {
    // Define the main class for the application.
    // Thay doi thanh package chuan ma chung ta se su dung
    mainClass = 'org.example.App'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}